<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preview – Too Real to Recognize</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #050505;
      color: #f4f4f4;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .top-nav {
      padding: 20px 5%;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #050505;
    }
    .top-nav a { color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
    .top-nav a:hover { color: #888; }

    .reader-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 5%;
      position: relative;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      border: 1px solid #222;
      background: #fff;
      width: 100%; 
      max-width: 900px; 
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    button.nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      border: 1px solid #333;
      width: 50px;
      height: 50px;
      font-size: 24px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s;
      border-radius: 50%; 
      display: flex;
      justify-content: center;
      align-items: center;
    }
    button.nav:hover { background: #fff; color: #000; }
    button.nav:disabled { opacity: 0.3; cursor: not-allowed; }
    
    button.left { left: -25px; }
    button.right { right: -25px; }

    @media (max-width: 768px) {
      button.left { left: 10px; }
      button.right { right: 10px; }
      button.nav { width: 40px; height: 40px; font-size: 18px; }
    }

    #page-info {
      font-size: 13px;
      color: #888;
      margin-top: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 5, 5, 0.98); 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    
    .overlay h2 {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      margin-bottom: 15px;
      color: #fff;
    }
    
    .overlay p {
      color: #888;
      max-width: 400px;
      margin-bottom: 30px;
      line-height: 1.6;
      font-size: 16px;
    }

    .overlay a {
      padding: 18px 36px;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 700;
      font-size: 16px;
      transition: background 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }
    .overlay a:hover { background: #cccccc; transform: scale(1.05); }

  </style>
</head>
<body>

  <div class="top-nav">
    <a href="/books/too-real-to-recognize-too-bold-to-erase-the-stunt-they-tried-to-bury/">&larr; Back to Book Page</a>
    <a href="/">LOUIEWOOD</a>
  </div>

  <div class="reader-wrap">
    <div class="canvas-container">
      <canvas id="pdf-canvas"></canvas>
      <button id="prevBtn" class="nav left" disabled>❮</button>
      <button id="nextBtn" class="nav right">❯</button>
    </div>
    <div id="page-info">Page 1</div>
  </div>

  <div id="locked" class="overlay" style="display:none;">
    <h2>Preview Limit Reached</h2>
    <p>You have reached the end of the free sample. To continue reading the full manuscript, please secure your copy.</p>
    
    <!-- REPLACE # WITH YOUR GUMROAD LINK FOR THIS BOOK -->
    <a href="#" target="_blank">Access the Full PDF (₱1099)</a>
  </div>

  <script>
    let PREVIEW_LIMIT = 5; 
    const url = "./too-real-to-recognize-too-bold-to-erase-the-stunt-they-tried-to-bury.pdf"; 

    const canvas = document.getElementById("pdf-canvas");
    const ctx = canvas.getContext("2d");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let pdfDoc = null;
    let pageNum = 1;
    let isLocked = false;

    canvas.addEventListener('contextmenu', event => event.preventDefault());

    pdfjsLib.getDocument(url).promise.then(function(pdf) {
      pdfDoc = pdf;
      
      // AUTO-CALCULATE 15% LIMIT
      PREVIEW_LIMIT = Math.max(3, Math.ceil(pdfDoc.numPages * 0.15)); 
      
      renderPage();
    });

    function renderPage() {
      pdfDoc.getPage(pageNum).then(function(page) {
        
        const containerWidth = document.querySelector('.canvas-container').clientWidth;
        const viewport = page.getViewport({ scale: 1.0 });
        
        const scale = containerWidth / viewport.width;
        const scaledViewport = page.getViewport({ scale: scale });

        const outputScale = window.devicePixelRatio || 1;

        canvas.width = Math.floor(scaledViewport.width * outputScale);
        canvas.height = Math.floor(scaledViewport.height * outputScale);
        canvas.style.width = Math.floor(scaledViewport.width) + "px";
        canvas.style.height = Math.floor(scaledViewport.height) + "px";

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        const renderContext = {
          canvasContext: ctx,
          transform: transform,
          viewport: scaledViewport
        };

        page.render(renderContext);
        
        document.getElementById("page-info").textContent = `Page ${pageNum} of ${pdfDoc.numPages}`;
        prevBtn.disabled = (pageNum === 1);
      });
    }

    nextBtn.addEventListener("click", () => {
      if (pageNum < pdfDoc.numPages) {
        if (pageNum >= PREVIEW_LIMIT) {
          triggerLock();
        } else {
          pageNum++;
          renderPage();
        }
      }
    });

    prevBtn.addEventListener("click", () => {
      if (pageNum > 1) {
        pageNum--;
        renderPage();
      }
    });

    document.addEventListener("keydown", function(event) {
      if (isLocked) return; 
      if (event.key === "ArrowRight") {
        if (pageNum < pdfDoc.numPages) {
          if (pageNum >= PREVIEW_LIMIT) { triggerLock(); } 
          else { pageNum++; renderPage(); }
        }
      } else if (event.key === "ArrowLeft") {
        if (pageNum > 1) { pageNum--; renderPage(); }
      }
    });

    function triggerLock() {
      isLocked = true;
      document.getElementById("locked").style.display = "flex";
    }

  </script>
</body>
</html>
